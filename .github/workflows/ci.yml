name: CI

# Offline checks only: no OpenAI key, no Supabase, no network services.
# test:archive and test:database need private fixtures (.private/) and are run locally.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run test:mcp:local
      - run: npm run test:mcp:saved
      - run: npm run test:codex
      - run: npm run test:mobile-api
      - run: npm audit --omit=dev --audit-level=high
