# AIRO Community Edition — copy community.env.example to .env, then `docker compose up -d`.
# The app image comes from GitHub Container Registry (built by .github/workflows/docker-image.yml).
# To build from source instead, add -f docker-compose.build.yml.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: airo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      AIRO_OWNER_EMAIL: ${AIRO_OWNER_EMAIL:-owner@localhost}
    volumes:
      - airo-db:/var/lib/postgresql/data
      - ./docker/db-init.sh:/docker-entrypoint-initdb.d/10-airo.sh:ro
      - ./supabase/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airo"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: "host=db port=5432 dbname=airo user=authenticator password=${POSTGRES_PASSWORD}"
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${AIRO_JWT_SECRET:?set AIRO_JWT_SECRET in .env (32+ chars)}
      PGRST_SERVER_PORT: "3000"

  airo:
    image: ghcr.io/devmingeonpark/airo:latest
    restart: unless-stopped
    depends_on:
      - postgrest
    ports:
      - "${AIRO_PORT:-3002}:3002"
    environment:
      AIRO_POSTGREST_URL: http://postgrest:3000
      AIRO_JWT_SECRET: ${AIRO_JWT_SECRET}
      AIRO_OWNER_PASSWORD: ${AIRO_OWNER_PASSWORD:?set AIRO_OWNER_PASSWORD in .env}
      AIRO_OWNER_EMAIL: ${AIRO_OWNER_EMAIL:-owner@localhost}
      AIRO_SITE_URL: ${AIRO_SITE_URL:-http://localhost:3002}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}

volumes:
  airo-db:
